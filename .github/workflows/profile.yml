name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *' # Hourly check; the gate below refreshes once per 10-hour window.
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'risbh19/risbh19'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check 10-hour refresh window
        id: cadence
        run: node scripts/refresh-schedule.mjs
      - name: Set up Node.js
        if: steps.cadence.outputs.due == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Verify data handling
        if: steps.cadence.outputs.due == 'true'
        run: node --test tests/*.test.mjs
      - name: Refresh public data and render cards
        if: steps.cadence.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - name: Generate GitHub Stats card (light)
        if: steps.cadence.outputs.due == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: '2.2.1'
          options: >-
            username=risbh19&show_icons=true&include_all_commits=true&disable_animations=true&card_width=500&custom_title=Rishabh%20Pal%27s%20GitHub%20Stats&title_color=7957d5&icon_color=ff3860&ring_color=8b70df&bg_color=ffffff&text_color=434d58&border_color=e4e2e2
          path: assets/github-stats-light.svg
          token: ${{ github.token }}
          fail_on_error: 'true'
      - name: Generate GitHub Stats card (dark)
        if: steps.cadence.outputs.due == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: '2.2.1'
          options: >-
            username=risbh19&show_icons=true&include_all_commits=true&disable_animations=true&card_width=500&custom_title=Rishabh%20Pal%27s%20GitHub%20Stats&title_color=a78bfa&icon_color=ff577f&ring_color=a78bfa&bg_color=0d1117&text_color=e6edf3&border_color=30363d
          path: assets/github-stats-dark.svg
          token: ${{ github.token }}
          fail_on_error: 'true'
      - name: Validate both stats cards and publish refresh time
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/publish-stats.mjs
      - name: Commit generated assets when changed
        if: steps.cadence.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ data/profile.json README.md
          if git diff --cached --quiet; then
            echo 'Profile data is unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh profile statistics [skip ci]'
          git push
